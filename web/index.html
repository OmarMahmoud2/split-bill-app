<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by the `--base-href` argument of
    `flutter build web` (must start and end with "/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="description" content="Open the link to see what you owe, pay your host the way you like and let them know. No account needed.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0F1C" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex,follow">

  <!-- Link previews (WhatsApp, iMessage, Slack...) read these without JS. -->
  <meta property="og:site_name" content="Evens">
  <meta property="og:title" content="Your share of the bill">
  <meta property="og:description" content="See what you owe, pay your host the way you like and tap I've paid. No account needed.">
  <meta property="og:type" content="website">

  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Evens">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Your share of the bill">
  <meta name="twitter:description" content="See what you owe and pay your host. No account needed.">
  <meta name="twitter:image" content="https://splitbillapp-ffc39.web.app/icons/Icon-512.png">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Evens">
  <meta name="apple-itunes-app" content="app-id=6757280494">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Start fetching the engine and app while the HTML skeleton paints. -->
  <link rel="preload" href="main.dart.js" as="script">

  <style id="splash-screen-style">
    /* v3 tokens (lib/theme/app_colors.dart). */
    :root {
      --canvas: #F5F7FB; --surface: #FFFFFF; --hairline: #E3E7EF;
      --divider: #EBEEF4; --ink: #0E1526; --muted: #5B6478; --mint: #0E7C72;
      --skeleton: #EBEEF4; --skeleton-hi: #F5F7FB; --outer: #EEF1F6;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #0A0F1C; --surface: #121A2B; --hairline: #22304A;
        --divider: #1B2740; --ink: #E8EDF7; --muted: #9AA4B8; --mint: #34D7C0;
        --skeleton: #1B2740; --skeleton-hi: #22304A; --outer: #1A2438;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      position: fixed; inset: 0; overflow: hidden; background: var(--canvas);
      transition: opacity 150ms ease-out;
    }
    #splash.gone { opacity: 0; }
    /* Same shell as the app: full-width bar with a hairline, then the body. */
    .sp-bar { height: 60px; box-sizing: border-box; border-bottom: 1px solid var(--hairline); background: color-mix(in srgb, var(--canvas) 78%, transparent); }
    .sp-bar > div, .sp-body { width: 100%; max-width: 640px; margin: 0 auto; box-sizing: border-box; padding: 0 20px; }
    .sp-bar > div { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .sp-body { padding-top: 24px; }
    .sp-brand { font-weight: 800; font-size: 20px; letter-spacing: -0.4px; }
    .sp-brand i { font-style: normal; color: var(--mint); }
    .sp-pills { display: flex; gap: 8px; }
    .sp-pill { width: 64px; height: 44px; border-radius: 999px; border: 1px solid var(--hairline); background: var(--surface); }
    .sp-pill.w { width: 104px; }
    .sp-line { height: 14px; border-radius: 6px; margin-top: 10px; background: var(--skeleton); }
    .sp-card { margin-top: 16px; border: 1px solid var(--hairline); border-radius: 24px; background: var(--surface); padding: 16px; }
    .sp-host { display: flex; align-items: center; gap: 12px; }
    .sp-host .sp-line { margin-top: 0; }
    .sp-dot { width: 48px; height: 48px; border-radius: 50%; background: var(--skeleton); flex: none; }
    .sp-chips { display: flex; gap: 10px; margin-top: 10px; }
    .sp-chip { width: 96px; height: 48px; border-radius: 14px; background: var(--skeleton); }
    .sp-tiles { display: flex; gap: 8px; margin-top: 10px; }
    .sp-tile { flex: 1; height: 64px; border-radius: 16px; background: var(--skeleton); }
    .sp-btn { height: 56px; border-radius: 16px; background: var(--skeleton); margin-top: 16px; }
    /* Phone/tablet personal link: the pay bar sits at the bottom. */
    .sp-paybar { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--hairline); background: var(--surface); padding: 12px 20px; }
    .sp-paybar > div { max-width: 640px; margin: 0 auto; }
    .sp-paybar .sp-btn { margin: 0; }
    .sp-cols, .sp-panel, .sp-desk { display: none; }
    /* Desktop personal link: two columns in a 1120 container. */
    @media (min-width: 1024px) {
      .sp-personal .sp-bar > div, .sp-personal .sp-body { max-width: 1120px; padding: 0 24px; }
      .sp-personal .sp-cols { display: flex; gap: 32px; align-items: flex-start; }
      .sp-personal .sp-left { flex: 3; min-width: 0; }
      .sp-personal .sp-panel { display: block; flex: 2; min-width: 0; margin-top: 0; padding: 20px; }
      .sp-personal .sp-mob { display: none; }
      .sp-personal .sp-paybar { display: none; }
    }
    @media (max-width: 1023.98px) { .sp-personal .sp-cols { display: block; } }
    /* No heavy animation on the web: a light fade only. */
    .sp-shimmer .sp-line, .sp-shimmer .sp-dot, .sp-shimmer .sp-chip, .sp-shimmer .sp-tile, .sp-shimmer .sp-btn { animation: sp-pulse 1.4s ease-in-out infinite; }
    @keyframes sp-pulse { 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) {
      .sp-shimmer .sp-line, .sp-shimmer .sp-dot, .sp-shimmer .sp-chip, .sp-shimmer .sp-tile, .sp-shimmer .sp-btn { animation: none; }
      #splash { transition: none; }
    }
    noscript p { max-width: 520px; margin: 40px auto; padding: 0 20px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="splash" class="sp-shimmer" aria-busy="true" aria-label="Loading">
    <div class="sp-bar"><div>
      <div class="sp-brand">evens<i>.</i></div>
      <div class="sp-pills" aria-hidden="true"><span class="sp-pill"></span><span class="sp-pill w"></span></div>
    </div></div>
    <div class="sp-body" aria-hidden="true">
      <div id="sp-picker">
        <div class="sp-host"><span class="sp-dot"></span><span style="flex: 1"><div class="sp-line" style="width: 70%"></div><div class="sp-line" style="width: 45%; height: 12px"></div></span></div>
        <div class="sp-line" style="width: 120px; margin-top: 24px"></div>
        <div class="sp-chips"><span class="sp-chip"></span><span class="sp-chip"></span><span class="sp-chip"></span></div>
      </div>
      <div id="sp-personal" hidden>
        <div class="sp-cols">
          <div class="sp-left">
            <div class="sp-host"><span class="sp-dot"></span><span style="flex: 1"><div class="sp-line" style="width: 70%"></div><div class="sp-line" style="width: 45%; height: 12px"></div></span></div>
            <div class="sp-card">
              <div class="sp-line" style="width: 140px; height: 12px; margin-top: 0"></div>
              <div class="sp-line" style="width: 190px; height: 34px"></div>
              <div class="sp-line" style="margin-top: 22px; width: 75%"></div>
              <div class="sp-line" style="margin-top: 14px; width: 60%"></div>
              <div class="sp-line" style="margin-top: 14px; width: 70%"></div>
              <div class="sp-line" style="margin-top: 14px; width: 50%"></div>
            </div>
            <div class="sp-mob">
              <div class="sp-line" style="width: 120px; margin-top: 20px"></div>
              <div class="sp-tiles"><span class="sp-tile"></span><span class="sp-tile"></span></div>
            </div>
          </div>
          <div class="sp-card sp-panel">
            <div class="sp-line" style="width: 100px; height: 12px; margin-top: 0"></div>
            <div class="sp-line" style="width: 180px; height: 40px"></div>
            <div class="sp-tiles" style="margin-top: 20px"><span class="sp-tile"></span><span class="sp-tile"></span></div>
            <div class="sp-tiles"><span class="sp-tile"></span><span class="sp-tile"></span></div>
            <div class="sp-btn"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="sp-paybar" id="sp-paybar" hidden aria-hidden="true"><div><div class="sp-btn"></div></div></div>
  </div>
  <noscript><p>Evens needs JavaScript to show your bill. Please enable it and reload this page.</p></noscript>

  <script id="splash-screen-script">
    // Personal link (?p= or legacy ?uid=): show the receipt-shaped skeleton.
    if (/[?&](p|uid)=[^&]/.test(location.search)) {
      document.getElementById("sp-picker").hidden = true;
      document.getElementById("sp-personal").hidden = false;
      document.getElementById("sp-paybar").hidden = false;
      document.getElementById("splash").classList.add("sp-personal");
    }
    // The app calls removeSplashFromWeb() after its first real frame
    // (translations loaded); Flutter's first frame can still be blank. The
    // timer is only a fallback if that call never comes.
    function removeSplashFromWeb() {
      var splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("gone");
      setTimeout(function () { splash.remove(); }, 200);
    }
    window.addEventListener("flutter-first-frame", function () {
      setTimeout(removeSplashFromWeb, 8000);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
