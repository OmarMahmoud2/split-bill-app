name: split_bill_app
description: "A new Flutter project."
publish_to: 'none' 

version: 2.0.0+24

environment:
  sdk: ^3.10.1

dependencies:
  flutter_timezone: ^5.1.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1
  provider: ^6.1.2
  image_picker: ^1.2.1
  http: ^1.6.0
  uuid: ^4.5.2
  image_cropper: ^11.0.0
  qr_flutter: ^4.1.0       # To generate your QR
  mobile_scanner: ^7.1.4   # To scan friends' QRs
  flutter_contacts: 2.1.0 # UIScene-safe registration; supports the current Flutter SDK.
  share_plus: ^12.0.1
  google_mobile_ads: ^7.0.0
  flutter_fortune_wheel: ^1.3.2
  rxdart: ^0.28.0 # Required by fortune_wheel
  url_launcher: ^6.3.2
  firebase_storage: ^13.6.1
  app_links: ^7.0.0
  package_info_plus: ^8.3.1
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^19.5.0
  intl_phone_field: ^3.2.0
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.5.4
  lottie: ^3.3.2
  intl: ^0.20.2
  easy_localization: ^3.0.8
  in_app_review: ^2.0.11
  upgrader: ^12.3.0
  universal_html: ^2.2.4
  purchases_flutter: ^10.14.0  # RevenueCat for in-app purchases (Xcode 27 compatible)
  app_tracking_transparency: ^2.0.6+1
  record: ^6.1.2
  path_provider: ^2.1.5
  audio_waveforms: ^2.0.1
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  home_widget: ^0.10.0
  speech_to_text: ^7.5.0
  pdf: ^3.12.0
  firebase_analytics: ^12.6.1
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
  change_app_package_name: ^1.5.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/brand/
    - assets/logo.png
    - assets/onboarding/
    - assets/animations/
    - assets/payments/
    - assets/translations/
    - assets/fonts/Inter/OFL.txt
    - assets/fonts/PlusJakartaSans/OFL.txt
    - assets/fonts/IBMPlexMono/OFL.txt

  # v3 typography. SIL Open Font License 1.1 (assets/fonts/*/OFL.txt).
  # Static instances of the Google Fonts variable fonts (ofl/inter,
  # ofl/plusjakartasans): Inter at opsz 14, wght 400/500/600/700; Plus
  # Jakarta Sans wght 600/700/800.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Only inside the paywall receipt (Pro perks and "Due today").
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Medium.ttf
          weight: 500

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/brand/evens_icon_1024.png"
    background_color: "#F7F7F5"
    theme_color: "#0F766E"
  image_path: "assets/brand/evens_icon_1024.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/brand/evens_adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/brand/evens_adaptive_foreground.png"
  remove_alpha_ios: true

# Splash Screen Configuration
flutter_native_splash:
  color: "#F7F7F5"
  image: assets/brand/evens_splash_light.png
  branding: assets/brand/evens_wordmark_light.png
  color_dark: "#0E0F0E"
  image_dark: assets/brand/evens_splash_dark.png
  branding_dark: assets/brand/evens_wordmark_dark.png
  android: true
  ios: true
  web: false # the guest web page has its own v3 skeleton splash in web/index.html
  android_12:
    color: "#F7F7F5"
    image: assets/brand/evens_splash_android12_light.png
    color_dark: "#0E0F0E"
    image_dark: assets/brand/evens_splash_android12_dark.png
